<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VecRec Benchmark Visualizer</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1d2230;
    --border: #2a3142;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --accent: #6ea8fe;
    --good: #4ade80;
    --bad: #f87171;
    --warn: #fbbf24;
    --neutral: #94a3b8;
    --bar-bg: #2a3142;
    --bar-fg: #6ea8fe;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  code, pre, .mono { font-family: "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace; }
  a { color: var(--accent); }

  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #1a2030 0%, #11141d 100%);
  }
  header h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }

  main { padding: 20px 24px 60px; max-width: 1200px; margin: 0 auto; }

  .selectors { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 12px; margin-bottom: 16px; align-items: stretch; }
  .picker {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .picker .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .picker select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 8px; font-size: 13px; width: 100%;
  }
  .picker .meta-line { font-size: 12px; color: var(--muted); min-height: 16px; }
  .icon-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0 14px;
    cursor: pointer;
    font-size: 13px;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn.danger:hover { border-color: var(--bad); color: var(--bad); }

  .controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 12px 0 18px; }
  .controls label { color: var(--muted); font-size: 13px; }
  .controls input, .controls select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }

  .meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .meta-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .meta-card h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .meta-card .desc { font-size: 14px; }
  .meta-card .ts { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .meta-card .stats { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 18px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; text-align: center; }
  .tile .num { font-size: 22px; font-weight: 600; }
  .tile .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
  .tile.good .num { color: var(--good); }
  .tile.bad .num { color: var(--bad); }
  .tile.warn .num { color: var(--warn); }

  .bench {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .bench-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; cursor: pointer; user-select: none;
  }
  .bench-header:hover { background: var(--panel-2); }
  .bench-header .name { font-weight: 600; flex: 0 0 auto; }
  .bench-header .desc { color: var(--muted); font-size: 13px; flex: 1; min-width: 0;
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bench-header .delta { font-variant-numeric: tabular-nums; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
  .bench-header .delta.good { color: var(--good); background: rgba(74,222,128,0.10); }
  .bench-header .delta.bad  { color: var(--bad);  background: rgba(248,113,113,0.10); }
  .bench-header .delta.zero { color: var(--muted); }
  .bench-header .badge { font-size: 11px; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .badge.changed { background: rgba(251,191,36,0.15); color: var(--warn); }
  .badge.same    { background: rgba(148,163,184,0.10); color: var(--neutral); }
  .badge.error   { background: rgba(248,113,113,0.15); color: var(--bad); }
  .badge.fail    { background: rgba(248,113,113,0.15); color: var(--bad); }

  .bench-body { display: none; padding: 4px 14px 14px; border-top: 1px solid var(--border); background: #131722; }
  .bench.open .bench-body { display: block; }
  .bench-body .row { margin-top: 10px; }
  .bench-body .row .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .bench-body .row .val { font-size: 13px; }
  .bench-body .expr { color: var(--text); }

  table.sched { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12.5px; }
  table.sched th, table.sched td { text-align: left; padding: 5px 6px; border-bottom: 1px solid #222a3a; vertical-align: middle; }
  table.sched th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  table.sched td.num { font-variant-numeric: tabular-nums; text-align: right; }
  table.sched tr.best td { background: rgba(110,168,254,0.05); }
  table.sched tr.best td:first-child::before { content: "★ "; color: var(--accent); }
  table.sched td.cell-best { color: var(--good); font-weight: 600; }
  table.sched td.cell-sched-best { color: var(--accent); }
  table.sched td.cell-na { color: var(--muted); }
  .bar { display: inline-block; height: 8px; background: var(--bar-bg); border-radius: 3px; overflow: hidden;
         width: 100%; max-width: 220px; vertical-align: middle; }
  .bar > span { display: block; height: 100%; background: var(--bar-fg); }
  .setup-badge { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: rgba(110,168,254,0.10); color: var(--accent); }
  .speedup-badge { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: rgba(74,222,128,0.10); color: var(--good); font-variant-numeric: tabular-nums; }
  .speedup-badge.slow { background: rgba(248,113,113,0.10); color: var(--bad); }
  .speedup-badge.flat { background: rgba(148,163,184,0.10); color: var(--muted); }

  .chart-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 18px; }
  .chart-card h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .chart-row { display: grid; grid-template-columns: minmax(0, 240px) 1fr 80px; gap: 10px; align-items: center;
               padding: 3px 0; font-size: 12.5px; }
  .chart-row.compare { grid-template-columns: minmax(0, 240px) 1fr 80px 1fr 80px; }
  .chart-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .chart-bar { background: var(--bar-bg); border-radius: 3px; height: 10px; overflow: hidden; }
  .chart-bar > span { display: block; height: 100%; background: var(--bar-fg); }
  .chart-bar.b > span { background: var(--good); }
  .chart-val { text-align: right; font-variant-numeric: tabular-nums; }
  .chart-val.muted { color: var(--muted); }
  .chart-axis { display: grid; grid-template-columns: minmax(0, 240px) 1fr 80px; gap: 10px; padding-top: 4px;
                border-top: 1px dashed #222a3a; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .chart-axis.compare { grid-template-columns: minmax(0, 240px) 1fr 80px 1fr 80px; }

  .compare-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .compare-pair .side { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  .compare-pair .side .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .compare-pair .side .sched { font-size: 12.5px; word-break: break-word; margin-top: 4px; }
  .compare-pair .side .cross { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .section-title { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
                   margin: 22px 0 8px; }
  .only-list { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; }
  .only-list div { padding: 4px 0; border-bottom: 1px dashed #222a3a; font-size: 13px; }
  .only-list div:last-child { border-bottom: 0; }

  .empty { color: var(--muted); padding: 30px 0; text-align: center; font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>VecRec Benchmark Visualizer</h1>
  <div class="sub">Pick one run to inspect, or two to compare baseline (A) vs candidate (B).</div>
</header>

<main>
  <div class="selectors">
    <div class="picker">
      <div class="label">File A — baseline</div>
      <select id="selA"><option value="">— none —</option></select>
      <div class="meta-line" id="metaA"></div>
    </div>
    <div class="picker">
      <div class="label">File B — candidate (optional)</div>
      <select id="selB"><option value="">— none —</option></select>
      <div class="meta-line" id="metaB"></div>
    </div>
    <button class="icon-btn" id="refreshBtn" type="button" title="Reload list">↻ Refresh</button>
    <button class="icon-btn danger" id="clearBtn" type="button">Clear</button>
  </div>

  <div class="controls" id="compareControls" style="display:none">
    <label>Threshold (%): <input type="number" id="threshold" value="0" min="0" step="0.5" style="width:72px"></label>
    <label>Sort:
      <select id="sort">
        <option value="name">name</option>
        <option value="delta-desc">Δ% (improved first)</option>
        <option value="delta-asc">Δ% (regressed first)</option>
      </select>
    </label>
    <label><input type="checkbox" id="onlyChanged"> Only schedule changes</label>
  </div>

  <div id="content">
    <div class="empty">Load a JSON file to begin.</div>
  </div>
</main>

<script>
"use strict";

// ── State ───────────────────────────────────────────────────────────────────
const state = {
  a: null,  // { name, payload }
  b: null,
  available: [],  // [{filename, timestamp, description, passed, failed, n_benchmarks}]
  threshold: 0,
  sort: "name",
  onlyChanged: false,
};

// ── Server-backed file loading ──────────────────────────────────────────────
async function refreshList() {
  let entries;
  try {
    const res = await fetch("/list", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    entries = await res.json();
  } catch (err) {
    document.getElementById("content").innerHTML =
      `<div class="empty">Could not load file list from the server (${err.message}).` +
      `<br>Run <code>uv run python benchmarks/serve_visualizer.py</code> from the project root.</div>`;
    return;
  }
  state.available = entries;
  populateSelects();
}

function optionLabel(e) {
  const desc = e.description ? ` — ${e.description}` : "";
  const counts = (e.passed != null || e.failed != null)
    ? ` (P${e.passed ?? "?"}/F${e.failed ?? "?"})` : "";
  return `${e.filename}${desc}${counts}`;
}

function populateSelects() {
  for (const slot of ["selA", "selB"]) {
    const sel = document.getElementById(slot);
    const prev = sel.value;
    sel.innerHTML = "";
    sel.appendChild(new Option("— none —", ""));
    for (const e of state.available) {
      sel.appendChild(new Option(optionLabel(e), e.filename));
    }
    if (state.available.some(e => e.filename === prev)) sel.value = prev;
  }
  // Refresh meta lines after populate
  updateMetaLine("a"); updateMetaLine("b");
}

function updateMetaLine(slot) {
  const el = document.getElementById(slot === "a" ? "metaA" : "metaB");
  const f = state[slot];
  if (!f) { el.textContent = ""; return; }
  const md = (f.payload && f.payload.metadata) || {};
  const ts = md.timestamp ? new Date(md.timestamp).toLocaleString() : "";
  el.textContent = `${ts}${md.description ? "  ·  " + md.description : ""}`;
}

async function loadIntoSlot(slot, filename) {
  if (!filename) { state[slot] = null; updateMetaLine(slot); render(); return; }
  try {
    const res = await fetch(`/results/${encodeURIComponent(filename)}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const payload = await res.json();
    state[slot] = { name: filename, payload };
  } catch (err) {
    alert(`Failed to load ${filename}: ${err.message}`);
    state[slot] = null;
  }
  updateMetaLine(slot);
  render();
}

document.getElementById("selA").addEventListener("change", e => loadIntoSlot("a", e.target.value));
document.getElementById("selB").addEventListener("change", e => loadIntoSlot("b", e.target.value));
document.getElementById("refreshBtn").addEventListener("click", refreshList);

document.getElementById("clearBtn").addEventListener("click", () => {
  state.a = state.b = null;
  document.getElementById("selA").value = "";
  document.getElementById("selB").value = "";
  updateMetaLine("a"); updateMetaLine("b");
  render();
});

document.getElementById("threshold").addEventListener("input", e => {
  state.threshold = parseFloat(e.target.value) || 0; render();
});
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
document.getElementById("onlyChanged").addEventListener("change", e => { state.onlyChanged = e.target.checked; render(); });

// ── Rendering helpers ───────────────────────────────────────────────────────
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "onClick") e.addEventListener("click", v);
    else if (k === "style") e.setAttribute("style", v);
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
}

function fmtMB(x) { return x == null ? "—" : x.toLocaleString(undefined, { maximumFractionDigits: 2 }); }
function fmtPct(x) { const sign = x > 0 ? "+" : ""; return `${sign}${x.toFixed(1)}%`; }
// ── Sweep helpers ──────────────────────────────────────────────────────────
// Each schedule's sweep entry exposes `throughputs_mbs` keyed "epi,rpi" — the
// kernel runner reports throughput directly so the visualizer just reads it.
function sweepInfo(b) {
  const info = { byPp: new Map(), columnKeys: [], hasData: false };
  const entries = b && b.sweep_timings_mbs;
  if (!entries || !entries.length) return info;
  info.hasData = true;
  const keySet = new Set();
  for (const entry of entries) {
    const throughputs = entry.throughputs_mbs || {};
    Object.keys(throughputs).forEach(k => keySet.add(k));
    let bestKey = null, bestMbs = -Infinity;
    for (const [k, v] of Object.entries(throughputs)) {
      if (v != null && v > bestMbs) { bestMbs = v; bestKey = k; }
    }
    // Two distinct schedules can pretty-print identically; prefer the entry
    // flagged is_best on collision so the displayed setup matches the winner.
    const existing = info.byPp.get(entry.schedule);
    if (!existing || (entry.is_best && !existing.isBest)) {
      info.byPp.set(entry.schedule, {
        bestSetup: bestKey,
        bestMbs: bestKey != null ? bestMbs : null,
        throughputs,
        isBest: !!entry.is_best,
      });
    }
  }
  info.columnKeys = [...keySet].sort((a, c) => {
    const [ae, ar] = a.split(",").map(Number);
    const [ce, cr] = c.split(",").map(Number);
    return ae - ce || ar - cr;
  });
  return info;
}

function effectiveThroughput(sched, info) {
  const s = info && info.byPp.get(sched.schedule);
  return s && s.bestMbs != null ? s.bestMbs : sched.throughput_mbs;
}

function bestEffectiveThroughput(b) {
  const info = sweepInfo(b);
  let best = 0;
  for (const s of (b.schedules || [])) {
    const eff = effectiveThroughput(s, info);
    if (eff > best) best = eff;
  }
  return best || (b.best_throughput_mbs ?? 0);
}

// The baseline is the original (un-transformed) schedule: by construction
// schedules[0] and its pp matches original_expr. Use swept throughput when the
// sweep ran for it, otherwise fall back to the pre-sweep throughput.
function baselineThroughput(b) {
  const schedules = b.schedules || [];
  if (!schedules.length) return null;
  const orig = b.original_expr;
  const info = sweepInfo(b);
  const baseSched = (orig && schedules.find(s => s.schedule === orig)) || schedules[0];
  return effectiveThroughput(baseSched, info);
}

// Speedup of the optimal schedule (best swept setup) over the baseline (also
// at its best swept setup). Returns null when either side is missing.
function benchSpeedup(b) {
  const baseline = baselineThroughput(b);
  const best = bestEffectiveThroughput(b);
  if (baseline == null || baseline <= 0 || !best) return null;
  return best / baseline;
}

function speedupClass(x) {
  if (x == null) return "flat";
  if (x > 1.05) return "";
  if (x < 0.95) return "slow";
  return "flat";
}

function fmtSpeedup(x) { return x == null ? "—" : `${x.toFixed(2)}×`; }

function speedupChart(items, title) {
  // items: [{ name, speedup }]
  const card = el("div", { class: "chart-card" });
  if (title) card.appendChild(el("h3", {}, title));
  const valid = items.filter(it => it.speedup != null && isFinite(it.speedup));
  if (!valid.length) {
    card.appendChild(el("div", { style: "color:var(--muted); font-size:13px" }, "No speedup data available."));
    return card;
  }
  const maxS = Math.max(1, ...valid.map(i => i.speedup));
  for (const it of items) {
    const s = it.speedup;
    const pct = (s != null && isFinite(s)) ? Math.min(100, (s / maxS) * 100) : 0;
    card.appendChild(el("div", { class: "chart-row" },
      el("span", { class: "chart-name mono" }, it.name),
      el("div", { class: "chart-bar" }, el("span", { style: `width:${pct.toFixed(1)}%` })),
      el("span", { class: `chart-val mono ${s == null ? "muted" : ""}` }, fmtSpeedup(s)),
    ));
  }
  card.appendChild(el("div", { class: "chart-axis" },
    el("span", {}, ""),
    el("span", {}, `0× ${" ".repeat(20)} ${maxS.toFixed(2)}×`),
    el("span", {}, ""),
  ));
  return card;
}

function speedupCompareChart(items) {
  // items: [{ name, aSpeedup, bSpeedup }]
  const card = el("div", { class: "chart-card" });
  card.appendChild(el("h3", {}, "Speedup over baseline — A (blue) vs B (green)"));
  const allVals = items.flatMap(i => [i.aSpeedup, i.bSpeedup]).filter(v => v != null && isFinite(v));
  if (!allVals.length) {
    card.appendChild(el("div", { style: "color:var(--muted); font-size:13px" }, "No speedup data available."));
    return card;
  }
  const maxS = Math.max(1, ...allVals);
  for (const it of items) {
    const aPct = (it.aSpeedup != null && isFinite(it.aSpeedup)) ? Math.min(100, it.aSpeedup / maxS * 100) : 0;
    const bPct = (it.bSpeedup != null && isFinite(it.bSpeedup)) ? Math.min(100, it.bSpeedup / maxS * 100) : 0;
    card.appendChild(el("div", { class: "chart-row compare" },
      el("span", { class: "chart-name mono" }, it.name),
      el("div", { class: "chart-bar" }, el("span", { style: `width:${aPct.toFixed(1)}%` })),
      el("span", { class: `chart-val mono ${it.aSpeedup == null ? "muted" : ""}` }, fmtSpeedup(it.aSpeedup)),
      el("div", { class: "chart-bar b" }, el("span", { style: `width:${bPct.toFixed(1)}%` })),
      el("span", { class: `chart-val mono ${it.bSpeedup == null ? "muted" : ""}` }, fmtSpeedup(it.bSpeedup)),
    ));
  }
  card.appendChild(el("div", { class: "chart-axis compare" },
    el("span", {}, ""),
    el("span", {}, `A — max ${maxS.toFixed(2)}×`),
    el("span", {}, ""),
    el("span", {}, `B — max ${maxS.toFixed(2)}×`),
    el("span", {}, ""),
  ));
  return card;
}

function metaCard(label, name, payload) {
  const md = (payload && payload.metadata) || {};
  return el("div", { class: "meta-card" },
    el("h3", {}, label),
    el("div", { class: "desc" }, md.description || el("span", { style: "color:var(--muted)" }, "(no description)")),
    el("div", { class: "ts mono" }, `${name || "—"} · ${md.timestamp || ""}`),
    el("div", { class: "stats" }, `passed=${md.passed ?? "?"}  failed=${md.failed ?? "?"}  filters=[${(md.filters||[]).join(", ")}]`)
  );
}

// ── Single-file render ─────────────────────────────────────────────────────
function renderSingle(file) {
  const root = document.getElementById("content");
  root.innerHTML = "";

  root.appendChild(el("div", { class: "meta-row", style: "grid-template-columns: 1fr;" }, metaCard("Run", file.name, file.payload)));

  const benches = file.payload.benchmarks || [];
  if (!benches.length) {
    root.appendChild(el("div", { class: "empty" }, "No benchmarks in this file."));
    return;
  }

  const items = benches
    .filter(b => !b.error)
    .map(b => ({ name: b.name, speedup: benchSpeedup(b) }));
  if (items.length) {
    root.appendChild(speedupChart(items, "Speedup of best schedule over baseline (both at best swept setup)"));
  }

  for (const b of benches) root.appendChild(renderBenchCard(b));
}

function renderBenchCard(b) {
  if (b.error) {
    return el("div", { class: "bench" },
      el("div", { class: "bench-header" },
        el("span", { class: "name" }, b.name),
        el("span", { class: "desc" }, b.description || ""),
        el("span", { class: "badge error" }, "error"),
      ),
      el("div", { class: "bench-body", style: "display:block" },
        el("div", { class: "row" }, el("div", { class: "val mono" }, b.error))
      )
    );
  }

  const card = el("div", { class: "bench" });
  const info = sweepInfo(b);
  const bestThr = bestEffectiveThroughput(b);
  const baseline = baselineThroughput(b);
  const speedup = benchSpeedup(b);
  const setupTxt = (b.best_ele_per_iter_multiple != null && b.best_rows_per_iter != null)
    ? `epi=${b.best_ele_per_iter_multiple}, rpi=${b.best_rows_per_iter}`
    : null;
  const header = el("div", { class: "bench-header" },
    el("span", { class: "name" }, b.name),
    el("span", { class: "desc" }, b.description || ""),
    el("span", { class: "mono", style: "color:var(--muted); font-size:12px" }, `${fmtMB(bestThr)} MB/s`),
    speedup != null && el("span", { class: `speedup-badge mono ${speedupClass(speedup)}`, title: `vs baseline ${fmtMB(baseline)} MB/s` }, fmtSpeedup(speedup)),
    setupTxt && el("span", { class: "setup-badge mono" }, setupTxt),
    !b.validation_ok && el("span", { class: "badge fail" }, "validation"),
    !b.ref_verified && el("span", { class: "badge fail" }, "ref"),
    !b.best_verified && el("span", { class: "badge fail" }, "best"),
  );
  header.addEventListener("click", () => card.classList.toggle("open"));
  card.appendChild(header);

  const body = el("div", { class: "bench-body" },
    el("div", { class: "row" },
      el("div", { class: "lbl" }, "Original expression"),
      el("div", { class: "val mono expr" }, b.original_expr || "")
    ),
    el("div", { class: "row" },
      el("div", { class: "lbl" },
        info.hasData
          ? `Schedules (${(b.schedules||[]).length}; throughput = best swept setup when available)`
          : `Schedules (${(b.schedules||[]).length}, sorted by throughput)`),
      schedulesTable(b.schedules || [], info)
    ),
    info.hasData && el("div", { class: "row" },
      el("div", { class: "lbl" }, "Sweep grid — throughput (MB/s) at (epi, rpi); higher is better"),
      sweepGridTable(b, info)
    )
  );
  card.appendChild(body);
  return card;
}

function schedulesTable(schedules, info) {
  info = info || { byPp: new Map(), hasData: false };
  const augmented = schedules.map(s => {
    const sw = info.byPp.get(s.schedule) || null;
    const eff = sw && sw.bestMbs != null ? sw.bestMbs : s.throughput_mbs;
    return { s, sw, eff };
  });
  augmented.sort((a, b) => b.eff - a.eff);
  const maxEff = augmented.length ? augmented[0].eff : 0;

  const headRow = el("tr", {},
    el("th", {}, "Schedule"),
    el("th", { class: "num" }, info.hasData ? "Default MB/s" : "MB/s"),
  );
  if (info.hasData) {
    headRow.appendChild(el("th", { class: "num" }, "Swept MB/s"));
    headRow.appendChild(el("th", {}, "Best setup"));
  }
  headRow.appendChild(el("th", { class: "num" }, "Rel"));
  headRow.appendChild(el("th", {}, ""));

  const tbl = el("table", { class: "sched" }, el("thead", {}, headRow));
  const tbody = el("tbody");
  for (const { s, sw, eff } of augmented) {
    const rel = maxEff > 0 ? eff / maxEff : 0;
    const tr = el("tr", { class: s.is_best ? "best" : "" },
      el("td", { class: "mono" }, s.schedule),
      el("td", { class: "num mono" }, fmtMB(s.throughput_mbs)),
    );
    if (info.hasData) {
      tr.appendChild(el("td", { class: "num mono" + (sw && sw.bestMbs != null ? "" : " cell-na") },
        sw && sw.bestMbs != null ? fmtMB(sw.bestMbs) : "—"));
      tr.appendChild(el("td", { class: "mono", style: "font-size:12px; color:var(--muted)" },
        sw && sw.bestSetup ? sw.bestSetup : "—"));
    }
    tr.appendChild(el("td", { class: "num mono" }, rel.toFixed(3)));
    tr.appendChild(el("td", {}, bar(rel)));
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
  return tbl;
}

function sweepGridTable(b, info) {
  const headRow = el("tr", {}, el("th", {}, "Schedule"));
  for (const k of info.columnKeys) {
    headRow.appendChild(el("th", { class: "num" }, k));
  }
  const tbl = el("table", { class: "sched" }, el("thead", {}, headRow));
  const tbody = el("tbody");
  for (const entry of (b.sweep_timings_mbs || [])) {
    const sw = info.byPp.get(entry.schedule);
    const bestKey = sw && sw.bestSetup;
    const tr = el("tr", { class: entry.is_best ? "best" : "" },
      el("td", { class: "mono" }, entry.schedule),
    );
    for (const k of info.columnKeys) {
      const t = (entry.throughputs_mbs || {})[k];
      let cls = "num mono";
      if (t == null) cls += " cell-na";
      else if (k === bestKey) cls += entry.is_best ? " cell-best" : " cell-sched-best";
      tr.appendChild(el("td", { class: cls }, fmtMB(t)));
    }
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
  return tbl;
}

function bar(frac) {
  const pct = Math.max(0, Math.min(1, frac)) * 100;
  return el("div", { class: "bar" }, el("span", { style: `width:${pct.toFixed(1)}%` }));
}

// ── Comparison render ──────────────────────────────────────────────────────
function indexBenches(payload) {
  const m = new Map();
  for (const b of (payload.benchmarks || [])) m.set(b.name, b);
  return m;
}

function compareEntry(a, b) {
  const aInfo = sweepInfo(a);
  const bInfo = sweepInfo(b);
  const aBest = bestEffectiveThroughput(a);
  const bBest = bestEffectiveThroughput(b);
  const deltaPct = aBest > 0 ? (bBest - aBest) / aBest * 100 : 0;
  const aSchedMap = new Map((a.schedules || []).map(s => [s.schedule, effectiveThroughput(s, aInfo)]));
  const bSchedMap = new Map((b.schedules || []).map(s => [s.schedule, effectiveThroughput(s, bInfo)]));
  return {
    name: a.name,
    a, b,
    aInfo, bInfo,
    aBest, bBest,
    deltaPct,
    schedule_changed: a.best_schedule !== b.best_schedule,
    a_thr_for_b_sched: aSchedMap.get(b.best_schedule) ?? null,
    b_thr_for_a_sched: bSchedMap.get(a.best_schedule) ?? null,
  };
}

function renderCompare(fileA, fileB) {
  const root = document.getElementById("content");
  root.innerHTML = "";

  root.appendChild(el("div", { class: "meta-row" },
    metaCard("File A — baseline", fileA.name, fileA.payload),
    metaCard("File B — candidate", fileB.name, fileB.payload),
  ));

  const aMap = indexBenches(fileA.payload);
  const bMap = indexBenches(fileB.payload);
  const common = [...aMap.keys()].filter(n => bMap.has(n));
  const onlyA = [...aMap.keys()].filter(n => !bMap.has(n));
  const onlyB = [...bMap.keys()].filter(n => !aMap.has(n));

  const errored = [];
  const cmps = [];
  for (const n of common) {
    const a = aMap.get(n), b = bMap.get(n);
    if (a.error || b.error) { errored.push(n); continue; }
    cmps.push(compareEntry(a, b));
  }

  // Summary tiles
  const improved = cmps.filter(c => c.deltaPct > 0).length;
  const regressed = cmps.filter(c => c.deltaPct < 0).length;
  const unchanged = cmps.length - improved - regressed;
  const schedChanged = cmps.filter(c => c.schedule_changed).length;

  root.appendChild(el("div", { class: "summary" },
    tile(cmps.length, "common"),
    tile(improved, "improved", "good"),
    tile(regressed, "regressed", "bad"),
    tile(unchanged, "unchanged"),
    tile(schedChanged, "schedule changed", "warn"),
  ));

  const speedupItems = cmps.map(c => ({
    name: c.name,
    aSpeedup: benchSpeedup(c.a),
    bSpeedup: benchSpeedup(c.b),
  }));
  if (speedupItems.length) {
    root.appendChild(speedupCompareChart(speedupItems));
  }

  // Sort
  const sorted = [...cmps];
  if (state.sort === "delta-desc") sorted.sort((x, y) => y.deltaPct - x.deltaPct);
  else if (state.sort === "delta-asc") sorted.sort((x, y) => x.deltaPct - y.deltaPct);
  else sorted.sort((x, y) => x.name.localeCompare(y.name));

  const visible = sorted.filter(c => {
    if (state.onlyChanged && !c.schedule_changed) return false;
    if (Math.abs(c.deltaPct) < state.threshold && !c.schedule_changed) return false;
    return true;
  });

  if (!visible.length) {
    root.appendChild(el("div", { class: "empty" },
      cmps.length ? `All ${cmps.length} benchmarks within ±${state.threshold}% and schedule unchanged.` : "No common benchmarks."));
  } else {
    for (const c of visible) root.appendChild(renderCompareCard(c));
  }

  if (errored.length) {
    root.appendChild(el("div", { class: "section-title" }, `Errored in one or both runs (${errored.length})`));
    const list = el("div", { class: "only-list" });
    for (const n of errored) list.appendChild(el("div", {}, n));
    root.appendChild(list);
  }
  if (onlyA.length) {
    root.appendChild(el("div", { class: "section-title" }, `Only in A (${onlyA.length})`));
    const list = el("div", { class: "only-list" });
    for (const n of onlyA) list.appendChild(el("div", {}, n));
    root.appendChild(list);
  }
  if (onlyB.length) {
    root.appendChild(el("div", { class: "section-title" }, `Only in B (${onlyB.length})`));
    const list = el("div", { class: "only-list" });
    for (const n of onlyB) list.appendChild(el("div", {}, n));
    root.appendChild(list);
  }
}

function tile(num, lbl, cls) {
  return el("div", { class: `tile ${cls || ""}` },
    el("div", { class: "num" }, String(num)),
    el("div", { class: "lbl" }, lbl)
  );
}

function renderCompareCard(c) {
  const card = el("div", { class: "bench" });
  const deltaCls = c.deltaPct > 0 ? "good" : c.deltaPct < 0 ? "bad" : "zero";
  const aSpeedup = benchSpeedup(c.a);
  const bSpeedup = benchSpeedup(c.b);
  const header = el("div", { class: "bench-header" },
    el("span", { class: "name" }, c.name),
    el("span", { class: "desc mono", style: "color:var(--muted); font-size:12px" },
      `${fmtMB(c.aBest)} → ${fmtMB(c.bBest)} MB/s`),
    (aSpeedup != null || bSpeedup != null) && el("span", { class: "mono", style: "color:var(--muted); font-size:12px" },
      `${fmtSpeedup(aSpeedup)} → ${fmtSpeedup(bSpeedup)}`),
    el("span", { class: `delta ${deltaCls} mono` }, fmtPct(c.deltaPct)),
    el("span", { class: `badge ${c.schedule_changed ? "changed" : "same"}` },
      c.schedule_changed ? "schedule changed" : "same schedule"),
  );
  header.addEventListener("click", () => card.classList.toggle("open"));
  card.appendChild(header);

  const body = el("div", { class: "bench-body" });

  if (c.schedule_changed) {
    body.appendChild(el("div", { class: "compare-pair" },
      el("div", { class: "side" },
        el("div", { class: "lbl" }, "A best schedule"),
        el("div", { class: "sched mono" }, c.a.best_schedule),
        el("div", { class: "cross mono" },
          c.b_thr_for_a_sched != null
            ? `B throughput on this schedule: ${fmtMB(c.b_thr_for_a_sched)} MB/s`
            : "Not tried in B"),
      ),
      el("div", { class: "side" },
        el("div", { class: "lbl" }, "B best schedule"),
        el("div", { class: "sched mono" }, c.b.best_schedule),
        el("div", { class: "cross mono" },
          c.a_thr_for_b_sched != null
            ? `A throughput on this schedule: ${fmtMB(c.a_thr_for_b_sched)} MB/s`
            : "Not tried in A"),
      ),
    ));
  } else {
    body.appendChild(el("div", { class: "row" },
      el("div", { class: "lbl" }, "Best schedule (unchanged)"),
      el("div", { class: "val mono expr" }, c.a.best_schedule)
    ));
  }

  body.appendChild(el("div", { class: "row" },
    el("div", { class: "lbl" }, sideLbl("All schedules — A", c.a)),
    schedulesTable(c.a.schedules || [], c.aInfo)
  ));
  if (c.aInfo && c.aInfo.hasData) {
    body.appendChild(el("div", { class: "row" },
      el("div", { class: "lbl" }, "Sweep grid — A (throughput MB/s)"),
      sweepGridTable(c.a, c.aInfo)
    ));
  }
  body.appendChild(el("div", { class: "row" },
    el("div", { class: "lbl" }, sideLbl("All schedules — B", c.b)),
    schedulesTable(c.b.schedules || [], c.bInfo)
  ));
  if (c.bInfo && c.bInfo.hasData) {
    body.appendChild(el("div", { class: "row" },
      el("div", { class: "lbl" }, "Sweep grid — B (throughput MB/s)"),
      sweepGridTable(c.b, c.bInfo)
    ));
  }

  card.appendChild(body);
  return card;
}

function sideLbl(label, bench) {
  if (bench && bench.best_ele_per_iter_multiple != null && bench.best_rows_per_iter != null) {
    return `${label} (best setup: epi=${bench.best_ele_per_iter_multiple}, rpi=${bench.best_rows_per_iter})`;
  }
  return label;
}

// ── Top-level render ────────────────────────────────────────────────────────
function render() {
  const compareControls = document.getElementById("compareControls");
  if (state.a && state.b) {
    compareControls.style.display = "flex";
    renderCompare(state.a, state.b);
  } else if (state.a) {
    compareControls.style.display = "none";
    renderSingle(state.a);
  } else if (state.b) {
    compareControls.style.display = "none";
    renderSingle(state.b);
  } else {
    compareControls.style.display = "none";
    document.getElementById("content").innerHTML = '<div class="empty">Pick a result file from the dropdowns above to begin.</div>';
  }
}

render();
refreshList();
</script>
</body>
